<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WISE</title>
  <meta name="description" content="WISE Creative Production">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="#top" class="brand"><img src="wise-logo.png" alt="WISE"></a>
    <nav>
      <a href="#work">WORK</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <div class="showreel placeholder">
        <span>SHOWREEL</span>
        <small>영상은 나중에 교체</small>
      </div>
      <div class="hero-caption">
        <p>CREATIVE PRODUCTION</p>
        <h1>WISE</h1>
      </div>
    </section>

    <section id="work" class="section work">
      <div class="section-head">
        <h2>WORK</h2>
        <span>SELECTED WORKS</span>
      </div>
      <div id="work-grid" class="work-grid"></div>
    </section>

    <section id="contact" class="section contact">
      <div class="contact-title">
        <p>HAVE A PROJECT?</p>
        <h2>LET'S WORK<br>TOGETHER.</h2>
        <a href="mailto:wise@bywise.kr">wise@bywise.kr</a>
      </div>

      <form id="contact-form" action="https://formsubmit.co/wise@bywise.kr" method="POST">
        <input type="hidden" name="_subject" value="[WISE] 홈페이지 문의">
        <input type="hidden" name="_captcha" value="true">
        <input type="text" name="_honey" style="display:none">
        <div class="field-row">
          <label>NAME / COMPANY<input name="name" required></label>
          <label>EMAIL<input type="email" name="email" required></label>
        </div>
        <div class="field-row">
          <label>PHONE<input name="phone"></label>
          <label>PROJECT
            <select name="project">
              <option>Commercial / Brand Film</option>
              <option>Digital Content</option>
              <option>Music / Performance</option>
              <option>Other</option>
            </select>
          </label>
        </div>
        <div class="field-row">
          <label>BUDGET<input name="budget" placeholder="예: 3,000만원"></label>
          <label>SCHEDULE<input name="schedule" placeholder="예: 2026년 10월 촬영"></label>
        </div>
        <label>MESSAGE<textarea name="message" rows="6" required></textarea></label>
        <button type="submit">SEND INQUIRY <span>↗</span></button>
        <p class="form-note">문의 내용은 wise@bywise.kr로 전달됩니다.</p>
      </form>
    </section>
  </main>

  <footer>
    <img src="wise-logo.png" alt="">
    <p>© WISE. ALL RIGHTS RESERVED.</p>
  </footer>

  <script src="works.js"></script>
</body>
</html>
