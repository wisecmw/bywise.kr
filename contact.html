<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONTACT — WISE</title><link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">

<header class="site-header">
  <a class="logo" href="index.html"><img src="wise-logo.png" alt="WISE"></a>
  <nav>
    <a href="index.html">HOME</a>
    <a href="work.html">WORK</a>
    <a href="contact.html">CONTACT</a>
  </nav>
</header>

<main class="contact-main">
  <section class="contact-copy">
    <p>HAVE A PROJECT?</p>
    <h1>LET'S WORK<br>TOGETHER.</h1>
    <a href="mailto:wise@bywise.kr">wise@bywise.kr</a>
  </section>
  <form action="https://formsubmit.co/wise@bywise.kr" method="POST">
    <input type="hidden" name="_subject" value="[WISE] 홈페이지 문의">
    <input type="hidden" name="_captcha" value="true">
    <label>NAME / COMPANY<input name="name" required></label>
    <label>EMAIL<input type="email" name="email" required></label>
    <label>PHONE<input name="phone"></label>
    <label>PROJECT
      <select name="project">
        <option>Commercial / Brand Film</option><option>Digital Content</option>
        <option>Music / Performance</option><option>Other</option>
      </select>
    </label>
    <label>BUDGET<input name="budget" placeholder="예: 3,000만원"></label>
    <label>SCHEDULE<input name="schedule" placeholder="예: 2026년 10월 촬영"></label>
    <label class="wide">MESSAGE<textarea name="message" rows="5" required></textarea></label>
    <button class="wide" type="submit">SEND INQUIRY <span>↗</span></button>
  </form>
</main>
</body></html>
