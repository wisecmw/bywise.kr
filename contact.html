<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CONTACT — WISE</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body class="contact-page">

<header class="site-header">

  <a class="logo" href="index.html">
    <img src="wise-logo.png" alt="WISE">
  </a>

  <nav>
    <a href="index.html">HOME</a>
    <a href="work.html">WORK</a>
    <a href="contact.html">CONTACT</a>
  </nav>

</header>


<main class="contact-main">

  <section class="contact-copy">

    <p>HAVE A PROJECT?</p>

    <h1>
      LET'S WORK<br>
      TOGETHER
    </h1>

    <a href="mailto:wise@bywise.kr">
      wise@bywise.kr
    </a>

  </section>


  <form
    action="https://formsubmit.co/wise@bywise.kr"
    method="POST"
  >

    <input
      type="hidden"
      name="_subject"
      value="[WISE] 홈페이지 신규 문의"
    >

    <input
      type="hidden"
      name="_template"
      value="table"
    >

    <input
      type="hidden"
      name="_captcha"
      value="false"
    >

    <input
      type="hidden"
      name="_next"
      value="https://bywise.kr/contact.html?sent=true"
    >

    <input
      type="text"
      name="_honey"
      style="display:none"
      tabindex="-1"
      autocomplete="off"
    >


    <label>
      NAME / COMPANY

      <input
        type="text"
        name="NAME / COMPANY"
        placeholder="Name or Company"
        required
      >
    </label>


    <label>
      EMAIL

      <input
        type="email"
        name="EMAIL"
        placeholder="your@email.com"
        required
      >
    </label>


    <label>
      PHONE

      <input
        type="text"
        name="PHONE"
        placeholder="010-0000-0000"
      >
    </label>


    <label>
      PROJECT

      <select name="PROJECT">

        <option value="">
          Select Project
        </option>

        <option value="Commercial / Brand Film">
          Commercial / Brand Film
        </option>

        <option value="Digital Content">
          Digital Content
        </option>

        <option value="Music / Performance">
          Music / Performance
        </option>

        <option value="Other">
          Other
        </option>

      </select>
    </label>


    <label>
      BUDGET

      <input
        type="text"
        name="BUDGET"
        placeholder="예: 3,000만원"
      >
    </label>


    <label>
      SCHEDULE

      <input
        type="text"
        name="SCHEDULE"
        placeholder="예: 2026년 10월 촬영"
      >
    </label>


    <label class="wide">
      MESSAGE

      <textarea
        name="MESSAGE"
        placeholder="프로젝트에 대해 간단히 알려주세요."
        required
      ></textarea>
    </label>


    <button
      class="wide"
      type="submit"
    >
      <span>SEND INQUIRY</span>
      <span>↗</span>
    </button>

  </form>

</main>


<script>

  const params =
    new URLSearchParams(window.location.search);

  if (params.get("sent") === "true") {

    const form =
      document.querySelector(".contact-main form");

    form.innerHTML = `
      <div style="
        grid-column:1/-1;
        min-height:420px;
        display:flex;
        flex-direction:column;
        justify-content:center;
        border-top:1px solid rgba(255,255,255,.5);
        border-bottom:1px solid rgba(255,255,255,.5);
      ">

        <p style="
          font-size:16px;
          letter-spacing:.1em;
          margin:0 0 20px;
        ">
          INQUIRY SENT
        </p>

        <h2 style="
          font-size:clamp(38px,5vw,80px);
          line-height:.95;
          letter-spacing:-.03em;
          margin:0;
        ">
          THANK YOU.<br>
          WE'LL GET BACK<br>
          TO YOU SOON.
        </h2>

      </div>
    `;

  }

</script>

</body>
</html>
